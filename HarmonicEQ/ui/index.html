<html><head><meta charset="UTF-8"><style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@500&family=JetBrains+Mono:wght@500&family=Space+Grotesk:wght@700&display=swap');

    --pf-hue:210;
    --pf-bg-60:hsl(210 28% 11%);
    --pf-bg-60-2:hsl(210 32% 7%);
    --pf-surface-30:hsl(210 20% 18%);
    --pf-surface-30-hi:hsl(210 18% 24%);
    --pf-accent-10:hsl(210 78% 56%);
    --pf-accent-glow:hsl(210 85% 62%);
    --pf-text:hsl(210 20% 94%);
    --pf-text-muted:hsl(210 14% 62%);
    --pf-border:hsl(210 22% 32%);
    --pf-font-header:'Space Grotesk',system-ui,sans-serif;
    --pf-font-label:'Inter',system-ui,sans-serif;
    --pf-font-value:'JetBrains Mono',ui-monospace,monospace;

  html,body{margin:0;overflow:hidden;user-select:none;-webkit-user-select:none;}
  body{width:600px;height:400px;background:linear-gradient(var(--pf-bg-60,#2D1B69),var(--pf-bg-60-2,#0D0D0D));position:relative;font-family:var(--pf-font-label);color:var(--pf-text);}

  .pf-knob-value{font-family:var(--pf-font-value);font-weight:500;font-size:9px;color:var(--pf-text-muted,rgba(255,255,255,0.5));text-align:center;display:block;margin-top:2px;}

  .pf-number-display{position:absolute;cursor:text;display:flex;align-items:center;justify-content:center;

    box-shadow:inset 0 2px 6px rgba(0,0,0,0.6);font-family:var(--pf-font-value);font-weight:500;font-size:13px;letter-spacing:0.06em;}

  .pf-number-display input.pf-lcd-input{width:100%;height:100%;background:transparent;border:none;outline:none;text-align:center;
    font:inherit;color:inherit;letter-spacing:inherit;}
  .pf-preset-name{position:absolute;cursor:default;display:flex;align-items:center;padding:0 8px;
    background:var(--pf-surface-30,#141820);border:1px solid var(--pf-border,#334155);border-radius:4px;font-size:12px;font-weight:600;color:var(--pf-text,#e2e8f0);
    overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
  .pf-preset-name.editing{cursor:text;border-color:var(--pf-accent-glow,#60a5fa);}
  .pf-preset-name input{width:100%;background:transparent;border:none;outline:none;font:inherit;color:inherit;}
  .pf-rate-selector{position:absolute;display:flex;gap:2px;align-items:stretch;}
  .pf-rate-opt{flex:1;border:1px solid var(--pf-border,#334155);background:var(--pf-surface-30,#1a2030);color:var(--pf-text-muted,#94a3b8);border-radius:3px;
    font-size:10px;font-weight:700;cursor:pointer;padding:0;min-width:0;}
  .pf-rate-opt.selected{background:var(--pf-accent-10,#3b82f6);border-color:var(--pf-accent-glow,#60a5fa);color:#fff;box-shadow:0 0 8px rgba(59,130,246,0.45);}
  .pf-led{position:absolute;display:flex;align-items:center;justify-content:center;pointer-events:none;}
  .pf-led-bulb{width:14px;height:14px;border-radius:50%;background:var(--off);border:1px solid #475569;
    box-shadow:inset 0 1px 3px rgba(0,0,0,0.5);transition:background 0.08s,box-shadow 0.08s;}
  .pf-led-bulb.lit{background:var(--on);border-color:#86efac;box-shadow:0 0 10px var(--on),inset 0 0 4px rgba(255,255,255,0.35);}
  .pf-vu-meter{position:absolute;background:var(--pf-bg-60-2,#0a0f18);border:1px solid var(--pf-border,#2a3548);border-radius:3px;overflow:hidden;pointer-events:none;}
  .pf-vu-fill{position:absolute;bottom:0;left:0;right:0;height:0%;transition:height 0.05s ease-out;}
  .pf-presets{position:absolute;top:8px;left:8px;z-index:10;}
  .pf-presets select{background:var(--pf-surface-30,#22242e);color:var(--pf-text,#e8eaf0);border:1px solid var(--pf-border,#444);padding:4px 8px;border-radius:6px;font-size:11px;}
  .pf-meter-container{position:absolute;top:8px;right:8px;bottom:88px;width:14px;z-index:30;pointer-events:none;
    background:var(--pf-bg-60-2,#0a0f18);border:1px solid var(--pf-border,#2a3548);border-radius:4px;overflow:hidden;display:flex;align-items:flex-end;}
  .pf-meter-bar{width:100%;height:calc(var(--meter-level,0)*100%);min-height:0;background:var(--pf-accent-10,#ff4d8d);
    box-shadow:0 0 8px rgba(255,77,141,0.55);transition:height 0.05s ease-out;}
  .pf-eq-curve{position:absolute;left:0;bottom:0;width:600px;height:80px;z-index:30;pointer-events:none;
    background:linear-gradient(180deg,rgba(10,15,24,0) 0%,rgba(10,15,24,0.72) 100%);}
  .pf-eq-curve polyline{stroke-linecap:round;stroke-linejoin:round;}
  .pf-eq-curve .pf-eq-line{fill:none;stroke:var(--pf-accent-10,#ff4d8d);stroke-width:2;}
  .pf-eq-curve .pf-eq-band-line{fill:none;stroke-width:1;stroke-opacity:0.4;}
  .pf-eq-curve .pf-eq-grid{stroke:rgba(148,163,184,0.15);stroke-width:1;}
</style></head>
<body>
<div class="pf-presets"><select id="pfPreset"><option value="0">Init</option><option value="1">Daily Driver</option><option value="2">Studio Safe</option><option value="3">Gentle Push</option><option value="4">Mix Ready</option><option value="5">Clean Lift</option><option value="6">Techno</option><option value="7">Ambient</option><option value="8">Hip-Hop</option><option value="9">Cinematic</option><option value="10">Experimental</option><option value="11">Edge of Stability</option><option value="12">Total Commitment</option><option value="13">The Deep End</option></select></div>
<div class="pf-label pf-plugin-header" style="left:20px;top:16px;width:560px;height:32px;font-family:Inter;font-size:24px;color:#C084FC;font-weight:bold">HARMONICEQ</div>
<div class="pf-knob-wrap" data-param="root" style="left:30px;top:80px;width:100px;height:100px;--accent:#C084FC;">

  <div class="pf-knob-body">

  </div>
  <span class="pf-knob-label">HARMONIC S</span>

  </div>
  <span class="pf-knob-label">MASTER TUN</span>

</div>
<div class="pf-knob-wrap" data-param="gain" style="left:30px;top:220px;width:100px;height:100px;--accent:#C084FC;">
  <div class="pf-knob-body">
    <div class="pf-knob-highlight"></div>
    <div class="pf-knob-pointer"></div>
  </div>
  <span class="pf-knob-label">OUTPUT</span>
  <span class="pf-knob-value">0</span>
</div>
<div class="pf-meter-container" aria-hidden="true"><div class="pf-meter-bar"></div></div>
<svg class="pf-eq-curve" viewBox="0 0 600 80" preserveAspectRatio="none" aria-hidden="true">
  <line class="pf-eq-grid" x1="0" y1="40" x2="600" y2="40"/>
  <polyline class="pf-eq-line" points="0,40 600,40"/>
</svg>
<script type="module">
/* Runs identically in the plugin (JUCE relays) and a plain browser (demo mode). */
let juceLib = null;
try { juceLib = await import('./js/juce/index.js'); } catch (e) { /* browser demo mode */ }

const pfMeterBar = document.querySelector('.pf-meter-bar');
const pfEqSvg = document.querySelector('.pf-eq-curve');
const EQ_W = 600;
const EQ_H = 80;
const EQ_MIN_DB = -24;
const EQ_MAX_DB = 24;

function dbToMeterLevel(levelDb) {
  const clamped = Math.min(0, Math.max(-60, Number(levelDb) || -100));
  return (clamped + 60) / 60;
}

function setMeterLevel(levelDb) {
  if (!pfMeterBar) return;
  pfMeterBar.style.setProperty('--meter-level', String(dbToMeterLevel(levelDb)));
}

function biquadMagAtFreq(freq, b0, b1, b2, a0, a1, a2, sampleRate) {
  const w = 2 * Math.PI * freq / sampleRate;
  const cosW = Math.cos(w);
  const sinW = Math.sin(w);
  const cos2W = Math.cos(2 * w);
  const sin2W = Math.sin(2 * w);
  const nr = b0 + b1 * cosW + b2 * cos2W;
  const ni = b1 * sinW + b2 * sin2W;
  const dr = a0 + a1 * cosW + a2 * cos2W;
  const di = a1 * sinW + a2 * sin2W;
  return Math.sqrt((nr * nr + ni * ni) / Math.max(1e-18, dr * dr + di * di));
}

function peakingMagnitude(freq, fc, gainDb, q, sampleRate) {
  const A = Math.pow(10, (gainDb || 0) / 40);
  const w0 = 2 * Math.PI * fc / sampleRate;
  const alpha = Math.sin(w0) / (2 * Math.max(0.01, q || 0.707));
  const cosW0 = Math.cos(w0);
  const b0 = 1 + alpha * A;
  const b1 = -2 * cosW0;
  const b2 = 1 - alpha * A;
  const a0 = 1 + alpha / A;
  const a1 = -2 * cosW0;
  const a2 = 1 - alpha / A;
  return biquadMagAtFreq(freq, b0, b1, b2, a0, a1, a2, sampleRate);
}

function lowpassMagnitude(freq, fc, q, sampleRate) {
  const w0 = 2 * Math.PI * fc / sampleRate;
  const alpha = Math.sin(w0) / (2 * Math.max(0.01, q || 0.707));
  const cosW0 = Math.cos(w0);
  const b0 = (1 - cosW0) / 2;
  const b1 = 1 - cosW0;
  const b2 = (1 - cosW0) / 2;
  const a0 = 1 + alpha;
  const a1 = -2 * cosW0;
  const a2 = 1 - alpha;
  return biquadMagAtFreq(freq, b0, b1, b2, a0, a1, a2, sampleRate);
}

function bandMagnitude(freq, band, sampleRate) {
  const fc = Math.max(20, Math.min(20000, Number(band.freq) || 1000));
  const q = Math.max(0.05, Number(band.q) || 0.707);
  const gain = Number(band.gain) || 0;
  if (Math.abs(gain) < 0.001) return lowpassMagnitude(freq, fc, q, sampleRate);
  return peakingMagnitude(freq, fc, gain, q, sampleRate);
}

const EQ_BAND_COLORS = ['#ff6b6b', '#ffd93d', '#6bcb77', '#4d96ff', '#ff6bff', '#ff9f43'];

function eqDbToY(db) {
  return EQ_H - ((db - EQ_MIN_DB) / (EQ_MAX_DB - EQ_MIN_DB)) * EQ_H;
}

function buildEqCurvePoints(magnitudeAtFreq) {
  const minF = 20;
  const maxF = 20000;
  const pts = [];
  for (let i = 0; i < 200; i++) {
    const t = i / 199;
    const freq = minF * Math.pow(maxF / minF, t);
    const mag = magnitudeAtFreq(freq);
    const db = 20 * Math.log10(Math.max(1e-9, mag));
    pts.push((t * EQ_W).toFixed(2) + ',' + eqDbToY(db).toFixed(2));
  }
  return pts;
}

function updateEQCurve(bands) {
  if (!pfEqSvg) return;
  const sampleRate = 44100;
  const list = bands || [];

  let bandGroup = pfEqSvg.querySelector('.pf-eq-bands');
  if (!bandGroup) {
    bandGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    bandGroup.setAttribute('class', 'pf-eq-bands');
    const mainLine = pfEqSvg.querySelector('.pf-eq-line');
    if (mainLine) pfEqSvg.insertBefore(bandGroup, mainLine);
    else pfEqSvg.appendChild(bandGroup);
  }
  bandGroup.replaceChildren();

  list.forEach((band, idx) => {
    const pts = buildEqCurvePoints((freq) => bandMagnitude(freq, band, sampleRate));
    const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
    poly.setAttribute('class', 'pf-eq-band-line');
    poly.setAttribute('stroke', EQ_BAND_COLORS[idx % EQ_BAND_COLORS.length]);
    poly.setAttribute('points', pts.join(' '));
    bandGroup.appendChild(poly);
  });

  const combinedPts = buildEqCurvePoints((freq) => {
    let mag = 1;
    for (const band of list) mag *= bandMagnitude(freq, band, sampleRate);
    return mag;
  });

  let poly = pfEqSvg.querySelector('.pf-eq-line');
  if (!poly) {
    poly = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
    poly.setAttribute('class', 'pf-eq-line');
    pfEqSvg.appendChild(poly);
  }
  poly.setAttribute('points', combinedPts.join(' '));
}

window.updateEQCurve = updateEQCurve;
window.__pluginBridge = window.__pluginBridge || {};
window.__pluginBridge.onMeterUpdate = setMeterLevel;

window.addEventListener('message', (e) => {
  const data = e.data;
  if (!data || typeof data !== 'object') return;
  if (data.type === 'meter') setMeterLevel(data.level);
  if (data.type === 'eq') updateEQCurve(Array.isArray(data.bands) ? data.bands : []);
});

setMeterLevel(-100);
updateEQCurve([]);

const PARAMS = [{"id":"root","min":0,"max":11,"unit":""},{"id":"scale","min":0,"max":6,"unit":""},{"id":"strength","min":0,"max":100,"unit":"%"},{"id":"tune","min":432,"max":444,"unit":"Hz"},{"id":"gain","min":-24,"max":24,"unit":"dB"}];
const RATE_PARAM_IDS = new Set([]);

function paramValueFromNorm(paramId, norm) {
  const p = PARAMS.find(x => x.id === paramId);
  if (!p) return norm;
  return p.min + norm * (p.max - p.min);
}

function formatNumberDisplay(node, norm) {
  const paramId = node.dataset.param;
  const unit = node.dataset.unit || PARAMS.find(x => x.id === paramId)?.unit || '';
  const fmt = node.dataset.format || 'number';
  if (fmt === 'rate') {
    const opts = ["1/1","1/2","1/4","1/8","1/16","1/32","1/64"];
    const idx = Math.round(norm * (opts.length - 1));
    return opts[Math.max(0, Math.min(opts.length - 1, idx))];
  }
  const p = PARAMS.find(x => x.id === paramId);
  if (!p) return norm.toFixed(2);
  const val = p.min + norm * (p.max - p.min);
  let text;
  if (Math.abs(p.max - p.min) >= 100 || (Number.isInteger(p.min) && Number.isInteger(p.max)))
    text = String(Math.round(val));
  else
    text = val.toFixed(2);
  return unit ? text + ' ' + unit : text;
}

function bindNumberDisplay(node) {
  const paramId = node.dataset.param;
  const textEl = node.querySelector('.pf-lcd-text');
  let state = null, norm = 0.5;
  if (juceLib && paramId) {
    state = juceLib.getSliderState(paramId);
    norm = state.getNormalisedValue();
    state.valueChangedEvent.addListener(() => { norm = state.getNormalisedValue(); draw(); });
  }
  function draw() {
    if (textEl) textEl.textContent = formatNumberDisplay(node, norm);
  }
  draw();
  node.addEventListener('click', () => {
    if (node.querySelector('input')) return;
    const cur = textEl ? textEl.textContent : '';
    if (textEl) textEl.style.display = 'none';
    const inp = document.createElement('input');
    inp.className = 'pf-lcd-input';
    inp.value = cur.replace(/[^0-9.\-/]/g, '').trim() || '0';
    node.appendChild(inp);
    inp.focus(); inp.select();
    const commit = () => {
      const raw = parseFloat(inp.value);
      if (!isNaN(raw) && state) {
        const p = PARAMS.find(x => x.id === paramId);
        if (p) {
          const n = (raw - p.min) / (p.max - p.min);
          state.setNormalisedValue(Math.min(1, Math.max(0, n)));
        }
      }
      inp.remove();
      if (textEl) textEl.style.display = '';
      draw();
    };
    inp.addEventListener('blur', commit);
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); commit(); } });
  });
}
document.querySelectorAll('.pf-number-display').forEach(bindNumberDisplay);

function bindPresetName(node) {
  const presetSel = document.getElementById('pfPreset');
  const syncFromPreset = () => {
    if (presetSel) node.textContent = presetSel.options[presetSel.selectedIndex]?.text || node.textContent;
  };
  if (presetSel) {
    presetSel.addEventListener('change', syncFromPreset);
    syncFromPreset();
  }
  node.addEventListener('dblclick', () => {
    if (node.querySelector('input')) return;
    node.classList.add('editing');
    const cur = node.textContent;
    const inp = document.createElement('input');
    inp.value = cur;
    node.textContent = '';
    node.appendChild(inp);
    inp.focus(); inp.select();
    const commit = () => {
      const name = inp.value.trim() || cur;
      node.classList.remove('editing');
      node.textContent = name;
      if (presetSel && juceLib) {
        const idx = +presetSel.value;
        try { juceLib.getNativeFunction?.('setProgramName')?.(idx, name); } catch(e){}
      }
    };
    inp.addEventListener('blur', commit);
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); commit(); } });
  });
}
document.querySelectorAll('.pf-preset-name').forEach(bindPresetName);

function bindRateSelector(node) {
  const paramId = node.dataset.param;
  const btns = [...node.querySelectorAll('.pf-rate-opt')];
  let state = null;
  if (juceLib && paramId) state = juceLib.getSliderState(paramId);
  function highlight(idx) {
    btns.forEach((b, i) => b.classList.toggle('selected', i === idx));
  }
  function syncFromNorm(norm) {
    const idx = Math.round(norm * (btns.length - 1));
    highlight(Math.max(0, Math.min(btns.length - 1, idx)));
  }
  if (state) {
    syncFromNorm(state.getNormalisedValue());
    state.valueChangedEvent.addListener(() => syncFromNorm(state.getNormalisedValue()));
  } else highlight(0);
  btns.forEach((btn, i) => btn.addEventListener('click', () => {
    highlight(i);
    if (state) state.setNormalisedValue(btns.length <= 1 ? 0 : i / (btns.length - 1));
  }));
}
document.querySelectorAll('.pf-rate-selector').forEach(bindRateSelector);

function bindLed(node) {
  const paramId = node.dataset.param;
  const bulb = node.querySelector('.pf-led-bulb');
  const threshold = parseFloat(node.dataset.threshold) || 0.5;
  const mode = node.dataset.mode || 'above';
  let state = null, norm = 0.5;
  if (juceLib && paramId) {
    state = juceLib.getSliderState(paramId);
    norm = state.getNormalisedValue();
    state.valueChangedEvent.addListener(() => { norm = state.getNormalisedValue(); draw(); });
  }
  function draw() {
    const val = paramValueFromNorm(paramId, norm);
    const lit = mode === 'below' ? val < threshold : val >= threshold;
    if (bulb) bulb.classList.toggle('lit', lit);
  }
  draw();
}
document.querySelectorAll('.pf-led').forEach(bindLed);

function setParameterValue (paramId, norm) {
  if (!paramId || !juceLib) return;
  try {
    juceLib.getSliderState (paramId).setNormalisedValue (Math.min (1, Math.max (0, norm)));
  } catch (e) { /* param not relayed */ }
}

function formatKnobValue(paramId, norm) {
  const p = PARAMS.find(x => x.id === paramId);
  if (!p) return norm.toFixed(2);
  const val = p.min + norm * (p.max - p.min);
  const unit = p.unit || '';
  let text = Math.abs(p.max - p.min) >= 100 ? String(Math.round(val)) : val.toFixed(2);
  return unit ? text + ' ' + unit : text;
}

function bindKnob(wrap) {
  const paramId = wrap.dataset.param;
  const body = wrap.querySelector('.pf-knob-body');
  const dial = wrap.querySelector('.pf-knob-dial');
  const arcValue = wrap.querySelector('.pf-knob-arc-value');
  const svgRoot = wrap.querySelector('.pf-knob-svg');
  const valueEl = wrap.querySelector('.pf-knob-value');
  const rotateTarget = dial || body;
  if (!rotateTarget) return;

  if (body && body.dataset.skin) {
    body.style.backgroundImage = 'url("' + body.dataset.skin + '")';
    body.style.backgroundSize = 'cover';
    body.style.backgroundPosition = 'center';
    body.style.backgroundRepeat = 'no-repeat';
  }

  let state = null, norm = 0.5;
  if (juceLib && paramId) {
    state = juceLib.getSliderState(paramId);
    norm = state.getNormalisedValue();
    state.valueChangedEvent.addListener(() => { norm = state.getNormalisedValue(); draw(); });
  }

  function draw() {
    const angle = -135 + norm * 270;
    if (dial) {
      dial.setAttribute('transform', 'rotate(' + angle + ' 50 50)');
      if (arcValue) arcValue.style.strokeDashoffset = String(1 - norm);
    } else if (body) {
      body.style.transform = 'rotate(' + angle + 'deg)';
    }
    if (valueEl) valueEl.textContent = formatKnobValue(paramId, norm);
  }
  draw();

  let dragging = false, startY = 0, startNorm = 0;
  const dragSurface = svgRoot || body;
  dragSurface.addEventListener('pointerdown', (e) => {
    dragging = true;
    startY = e.clientY;
    startNorm = norm;
    if (state) state.sliderDragStarted();
    dragSurface.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  dragSurface.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    norm = Math.min(1, Math.max(0, startNorm + (startY - e.clientY) / 150));
    if (state) state.setNormalisedValue(norm);
    else setParameterValue(paramId, norm);
    draw();
  });
  const endDrag = (e) => {
    if (!dragging) return;
    dragging = false;
    if (state) state.sliderDragEnded();
    try { dragSurface.releasePointerCapture(e.pointerId); } catch (_) {}
  };
  dragSurface.addEventListener('pointerup', endDrag);
  dragSurface.addEventListener('pointercancel', endDrag);
}
document.querySelectorAll('.pf-knob-wrap').forEach(bindKnob);

function bindSlider(wrap) {
  const paramId = wrap.dataset.param;
  const track = wrap.querySelector('.pf-slider-track');
  const thumb = wrap.querySelector('.pf-slider-thumb');
  const fill = wrap.querySelector('.pf-slider-fill');
  const valueEl = wrap.querySelector('.pf-slider-value');
  if (!track) return;

  let state = null, norm = 0.5;
  if (juceLib && paramId) {
    state = juceLib.getSliderState(paramId);
    norm = state.getNormalisedValue();
    state.valueChangedEvent.addListener(() => { norm = state.getNormalisedValue(); draw(); });
  }

  function draw() {
    const pct = (norm * 100).toFixed(2) + '%';
    if (thumb) thumb.style.bottom = pct;
    if (fill) fill.style.height = pct;
    if (valueEl) valueEl.textContent = formatKnobValue(paramId, norm);
  }
  draw();

  let dragging = false, startY = 0, startNorm = 0;
  track.addEventListener('pointerdown', (e) => {
    dragging = true;
    startY = e.clientY;
    startNorm = norm;
    if (state) state.sliderDragStarted();
    track.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  track.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    norm = Math.min(1, Math.max(0, startNorm + (startY - e.clientY) / 150));
    if (state) state.setNormalisedValue(norm);
    else setParameterValue(paramId, norm);
    draw();
  });
  const endDrag = (e) => {
    if (!dragging) return;
    dragging = false;
    if (state) state.sliderDragEnded();
    try { track.releasePointerCapture(e.pointerId); } catch (_) {}
  };
  track.addEventListener('pointerup', endDrag);
  track.addEventListener('pointercancel', endDrag);
}
document.querySelectorAll('.pf-slider-wrap').forEach(bindSlider);



window.__setVuLevel = (level) => {
  const clamped = Math.min(1, Math.max(0, level));
  document.querySelectorAll('.pf-vu-meter .pf-vu-fill').forEach(fill => {
    fill.style.height = (clamped * 100).toFixed(1) + '%';
  });
};
// Demo animation for browser preview
(function demoVu(){

  setInterval(() => { t += 0.08; window.__setVuLevel(0.35 + 0.35 * Math.abs(Math.sin(t))); }, 50);

(function demoOverlay(){
  if (juceLib) return;
  let t = 0;
  setInterval(() => {
    t += 0.05;
    setMeterLevel(-28 + 22 * Math.abs(Math.sin(t)));
    updateEQCurve([{ freq: 800 + 700 * Math.abs(Math.sin(t * 0.7)), gain: 4 * Math.sin(t * 0.4), q: 0.9 }]);
  }, 33);
})();
